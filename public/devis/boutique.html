<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 18px 80px; }
    .head { background: linear-gradient(135deg, #1e1b4b, #4f46e5 60%, #7c3aed); color: #fff; padding: 34px 0 70px; }
    .head .wrap { padding-bottom: 0; display: flex; gap: 16px; align-items: center; }
    .head img { max-height: 54px; max-width: 160px; background: #fff; border-radius: 10px; padding: 6px; }
    .head h1 { font-size: 27px; }
    .head p { margin: 6px 0 0; color: rgba(255,255,255,.82); }
    .form { margin-top: -46px; }
    .sec { padding: 22px; }
    .sec + .sec { border-top: 1px solid var(--border); }
    .sec h2 { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .sec h2 .n { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 13px; }
    .item { border: 1px solid var(--border); border-radius: 14px; padding: 16px; background: var(--surface-2); position: relative; }
    .item + .item { margin-top: 12px; }
    .item .rm { position: absolute; top: 10px; right: 10px; }
    .pos { display: grid; grid-template-columns: 1.3fr .7fr .7fr 1.1fr .6fr 30px; gap: 8px; align-items: end; margin-top: 8px; }
    .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .presets button { border: 1px dashed var(--border-strong); background: var(--surface); border-radius: 8px; padding: 4px 9px; font-size: 12px; color: var(--muted); }
    .presets button:hover { border-color: var(--primary); color: var(--primary); }
    .ok { text-align: center; padding: 50px 24px; }
    .ok .big { width: 70px; height: 70px; border-radius: 50%; background: var(--success-50); color: var(--success); display: grid; place-items: center; margin: 0 auto 16px; }
    .ok .big svg { width: 34px; height: 34px; }
    .hp { position: absolute; left: -9999px; }
    .prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .prod { display: flex; flex-direction: column; }
    .prod .img { aspect-ratio: 1; background: var(--surface-2); border-radius: 12px 12px 0 0; display: grid; place-items: center; overflow: hidden; color: var(--faint); }
    .prod .img img { width: 100%; height: 100%; object-fit: cover; }
    .prod .price { font-size: 20px; font-weight: 800; }
    .cart-line { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: center; }
    body.embed { background: transparent; } body.embed .head { display: none; } body.embed .form { margin-top: 0; }
    @media (max-width: 700px) { .pos { grid-template-columns: 1fr 1fr; } .head h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <div id="root"><div class="empty" style="padding-top:120px">Chargement…</div></div>
  <script type="module" src="boutique.js"></script>
</body>
</html>
